name: MediaPro APK

# Har push'da va qo'lda (Actions > "MediaPro APK" > Run workflow) ishga tushadi.
on:
  push:
    branches: [ main, master, mediapro ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: gradlew executable
        run: chmod +x gradlew

      # Release kaliti secret'larda bo'lsa — imzolangan release quriladi.
      # Bo'lmasa — debug quriladi (o'rnatish mumkin, test uchun).
      - name: Release key tayyorlash
        id: key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Qurish
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "yes" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: APK yuklash (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mediapro-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
